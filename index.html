<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#14283f">
  <meta name="description" content="Your personal offline-first S&OP learning library.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=14">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <title>S&OP Academy</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="S&OP Academy home">
      <span class="brand-mark">S</span>
      <span><strong>S&OP Academy</strong><small>PERSONAL LEARNING LIBRARY</small></span>
    </a>
    <span id="connection" class="connection"><i></i> Checking</span>
  </header>

  <main class="shell">
    <section class="hero progress-hero" aria-label="Your learning progress">
      <div class="progress-card">
        <div class="progress-heading"><span>YOUR PROGRESS</span><strong id="progress-count">0 / 0 topics</strong></div>
        <div class="progress-track"><span id="progress-bar"></span></div>
        <p id="progress-caption">Your learning progress will appear here.</p>
      </div>
    </section>


    <label class="searchbox">
      <span aria-hidden="true">⌕</span>
      <input id="search" type="search" placeholder="Search modules, formulas, or S&OP terms" autocomplete="off">
      <kbd>/</kbd>
    </label>

    <nav class="library-tabs" role="tablist" aria-label="Academy sections">
      <button class="library-tab active" data-view="modules" role="tab" aria-selected="true">All modules</button>
      <button class="library-tab" data-view="formulas" role="tab" aria-selected="false">Formula library</button>
      <button class="library-tab" data-view="glossary" role="tab" aria-selected="false">S&OP</button>
    </nav>

    <section id="module-list" class="module-list library-panel" aria-live="polite">
      <div class="loading">Loading your learning library…</div>
    </section>
    <section id="formula-list" class="reference-list library-panel" hidden aria-live="polite"></section>
    <section id="glossary-list" class="reference-list library-panel" hidden aria-live="polite"></section>
    <footer><span>S&OP ACADEMY</span><span id="version">Offline-ready library</span></footer>
  </main>

  <dialog id="lecture-dialog" class="lecture-dialog">
    <div class="dialog-head">
      <div><p id="lecture-kicker" class="eyebrow">LECTURE</p><h2 id="lecture-title">Topic title</h2></div>
      <button id="close-dialog" class="close-button" aria-label="Close lecture">×</button>
    </div>
    <div id="lecture-body" class="lecture-body"></div>
    <div class="dialog-actions">
      <button id="bookmark-button" class="button secondary">☆ Bookmark</button>
      <button id="complete-button" class="button primary">Mark complete</button>
    </div>
  </dialog>
  <section id="reader-view" class="reader-view" hidden aria-label="Lecture reader">
    <header class="reader-head">
      <button id="reader-back" class="reader-back" type="button" aria-label="Back to module">‹ <span>Library</span></button>
      <div class="reader-heading"><p id="reader-kicker" class="eyebrow">LECTURE</p><h1 id="reader-title">Topic title</h1></div>
      <span id="reader-connection" class="reader-status">ONLINE</span>
    </header>
    <article id="reader-content" class="reader-content"></article>
    <aside id="reader-progress" class="reader-progress" aria-label="Reading progress">
      <span id="reader-remaining" class="reader-remaining" aria-hidden="true"></span>
      <div class="reader-progress-track" aria-hidden="true"><span id="reader-progress-fill"></span></div>
    </aside>
    <footer class="reader-actions">
      <button id="reader-bookmark" class="button secondary" type="button">☆ Bookmark</button>
      <button id="reader-complete" class="button primary" type="button">Mark complete</button>
    </footer>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" defer></script>
  <script src="./app.js?v=15" defer></script>
</body>
</html>
